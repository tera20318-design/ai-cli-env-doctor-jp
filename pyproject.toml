[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli-env-doctor-jp"
version = "0.1.0"
description = "Japanese local environment doctor for AI and CLI developers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "ai-cli-env-doctor-jp contributors" }
]
keywords = ["cli", "doctor", "japanese", "ai", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tera20318-design/ai-cli-env-doctor-jp"
Repository = "https://github.com/tera20318-design/ai-cli-env-doctor-jp"
Issues = "https://github.com/tera20318-design/ai-cli-env-doctor-jp/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
  "twine>=5.1",
]

[project.scripts]
ai-cli-env-doctor-jp = "ai_cli_env_doctor_jp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
